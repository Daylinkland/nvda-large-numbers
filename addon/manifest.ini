name = largeNumberReader
summary = "Large Number Reader"
description = "Reads long numbers as words instead of one digit at a time: 1235892 becomes one million two hundred thirty five thousand eight hundred ninety two, or un millon doscientos treinta y cinco mil ochocientos noventa y dos. English and Spanish are built in; the number language follows NVDA's own language, and can be changed in NVDA Settings, Large Number Reader. Handles one million up to 36 digits. Press NVDA+8 to turn it on or off; the setting is remembered between sessions. Only the speech text is rewritten, using NVDA's official speech filter, so nothing else in NVDA changes."
version = 1.2
author = "Made for Enzo"
docFileName = readme.html
minimumNVDAVersion = 2025.1
lastTestedNVDAVersion = 2026.2
